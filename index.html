<!DOCTYPE html>
<html>
<head>
    <title>Live Cricket Scorer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; }
        .score { font-size: 50px; font-weight: bold; margin: 20px; }
        button { padding: 15px; margin: 5px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="score">Score: <span id="runs">0</span>/<span id="wickets">0</span></div>
    <div>Overs: <span id="overs">0.0</span></div>
    <br>

    <button onclick="window.play(0)">0</button>
    <button onclick="window.play(1)">1</button>
    <button onclick="window.play(4)">4</button>
    <button onclick="window.play(6)">6</button>
    <button onclick="window.wicket()" style="color:red">WICKET</button>
    <button onclick="window.undo()">UNDO</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB3_Yt5cc7eXXvxKlIaovAvIZ4l5fWIC1g",
            authDomain: "bkcclive.firebaseapp.com",
            databaseURL: "https://bkcclive-default-rtdb.firebaseio.com",
            projectId: "bkcclive",
            storageBucket: "bkcclive.firebasestorage.app",
            messagingSenderId: "1042728754418",
            appId: "1:1042728754418:web:7bed9c4bf9b6e5f15e446b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'liveMatch/');

        // Local Variables
        let runs = 0, wickets = 0, balls = 0;

        // Firebase Listener (Live Update)
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                runs = data.runs;
                wickets = data.wickets;
                balls = data.balls;
                document.getElementById("runs").innerText = runs;
                document.getElementById("wickets").innerText = wickets;
                document.getElementById("overs").innerText = Math.floor(balls/6) + "." + (balls%6);
            }
        });

        // Firebase Update Function
        function updateFirebase() {
            set(dbRef, { runs, wickets, balls });
        }

        // Global Window Functions
        window.play = (r) => { 
            runs += r; 
            balls++; 
            updateFirebase(); 
        };

        window.wicket = () => { 
            wickets++; 
            balls++; 
            updateFirebase(); 
        };

        window.undo = () => {
            // यहाँ आप अपनी Undo लॉजिक जोड़ सकते हैं
            alert("Undo clicked!");
        };
    </script>
</body>
</html>
