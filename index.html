<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>लाइव क्रिकेट स्कोरबोर्ड</title>
    <style>
        body { font-family: sans-serif; background: #0e4f1f; color: white; text-align: center; padding: 20px; }
        .scoreboard { background: #000; padding: 30px; border-radius: 15px; display: inline-block; }
        .score { font-size: 50px; font-weight: bold; }
        .admin-panel { margin-top: 30px; padding: 20px; background: #fff; color: #000; border-radius: 10px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; border: none; background: #ff5722; color: white; font-weight: bold; }
    </style>
</head>
<body>

    <div class="scoreboard">
        <h3>लाइव स्कोर</h3>
        <div id="score-display" class="score">0/0</div>
    </div>

    <div class="admin-panel">
        <h4>एडमिन कंट्रोल</h4>
        <button onclick="updateScore(1)">+1 रन</button>
        <button onclick="updateScore(4)">+4 रन</button>
        <button onclick="updateScore(6)">+6 रन</button>
        <button onclick="addWicket()">विकेट गिरा!</button>
        <button onclick="resetScore()">रिसेट</button>
    </div>

    <script type="module">
        // Firebase मॉड्यूलर SDK इम्पोर्ट करें
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getDatabase, ref, onValue, update, set, runTransaction } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB3_Yt5cc7eXXvxKlIaovAvIZ4l5fWIC1g",
            authDomain: "bkcclive.firebaseapp.com",
            databaseURL: "https://bkcclive-default-rtdb.firebaseio.com",
            projectId: "bkcclive",
            storageBucket: "bkcclive.firebasestorage.app",
            messagingSenderId: "1042728754418",
            appId: "1:1042728754418:web:656f154250b9c4e95e446b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const scoreRef = ref(db, 'match');

        // स्कोर अपडेट करने के फ़ंक्शन्स
        window.updateScore = (r) => {
            runTransaction(scoreRef, (m) => {
                if (m) { m.runs = (m.runs || 0) + r; }
                else { m = { runs: r, wickets: 0 }; }
                return m;
            });
        };

        window.addWicket = () => {
            runTransaction(scoreRef, (m) => {
                if (m) { m.wickets = (m.wickets || 0) + 1; }
                else { m = { runs: 0, wickets: 1 }; }
                return m;
            });
        };

        window.resetScore = () => { set(scoreRef, {runs: 0, wickets: 0}); };

        // लाइव डेटा सुनने के लिए
        onValue(scoreRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('score-display').innerText = `${data.runs || 0}/${data.wickets || 0}`;
            }
        });
    </script>
</body>
</html>
