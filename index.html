<script>
// तुम्हारे सभी variables और functions (teamEl, runs, play, wideBall आदि) वही रखे हैं
// ... (तुम्हारा पूरा variable और function code यहाँ paste करो, मैंने नीचे सिर्फ changed parts दिखाए हैं)

// completeWicketProcess fix
function completeWicketProcess(outIndex) {
    balls++;
    currentBowler.balls++;

    // Firebase write with better handling
    if (window.db && window.ref && window.set) {
        const scoreRef = window.ref(window.db, 'matches/current_score');
        window.set(scoreRef, {
            runs: runs,
            wickets: wickets,
            overs: Math.floor(balls / 6) + "." + (balls % 6)
        })
        .then(() => {
            console.log("Wicket: Score saved to Firebase");
        })
        .catch(err => {
            console.error("Wicket write error:", err.code, err.message);
            alert("Firebase write fail: " + err.message);
        });
    } else {
        console.error("Firebase not ready for write");
    }

    let currentOver = Math.floor(balls / 6) + "." + (balls % 6);
    fow.push(`\( {runs}/ \){wickets} (${batsmen[outIndex].name} - ${currentOver})`);

    let currentInning = (innings === 1) ? overByOverData.inning1 : overByOverData.inning2;
    let lastEntry = currentInning[currentInning.length - 1];
    lastEntry.wickets = wickets;

    currentOverBalls.push("W");
    updateOverTracker();

    if (wickets < 10) {
        batsmen.push(createNewBatsman());
        if (outIndex === striker) striker = batsmen.length - 1;
        else nonStriker = batsmen.length - 1;
    }

    document.getElementById("wicketModal").style.display = "none";
    endBall();
    saveMatch();
    update();
}

// नया Test function
function testFirebaseSave() {
    if (!window.db || !window.ref || !window.set) {
        alert("Firebase initialize नहीं हुआ! Console चेक करो");
        return;
    }

    const testRef = window.ref(window.db, 'test/from_app');
    window.set(testRef, {
        message: "Test from Shahin app - " + new Date().toLocaleString(),
        value: Math.floor(Math.random() * 100),
        runsExample: runs || 0
    })
    .then(() => {
        console.log("Test save SUCCESS!");
        alert("Test data save हो गया! Firebase console में 'test/from_app' चेक करो");
    })
    .catch(err => {
        console.error("Test save FAIL:", err);
        alert("Test fail: " + err.message + " (code: " + (err.code || 'unknown') + ")");
    });
}

// तुम्हारे play, wideBall, noBall में पहले से ही .then/.catch है — वो ठीक हैं

// बाकी functions (update, renderScorecards आदि) वही रखे
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCuPZ-m11fbOfisovvjcC6IqqvYiFDnQNY",
    authDomain: "bkccsocre.firebaseapp.com",
    databaseURL: "https://bkccsocre-default-rtdb.firebaseio.com",
    projectId: "bkccsocre",
    storageBucket: "bkccsocre.firebasestorage.app",
    messagingSenderId: "852922311265",
    appId: "1:852922311265:web:592e561c6a4307f3f8c020"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.db = db;
  window.ref = ref;
  window.set = set;

  console.log("Firebase SDK Initialized successfully!");

  // Listener with better error
  const scoreRef = ref(db, 'matches/current_score');
  onValue(scoreRef, (snapshot) => {
    const data = snapshot.val();
    console.log("Listener triggered, data:", data);
    if (data) {
      document.getElementById("runs").innerText = data.runs || 0;
      document.getElementById("wickets").innerText = data.wickets || 0;
      document.getElementById("overs").innerText = data.overs || "0.0";
    }
  }, (error) => {
    console.error("Realtime listener error:", error);
    alert("Firebase connection issue: " + error.message);
  });
</script>
