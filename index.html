<head>

</head>  <body>  <div class="box">  
<h3>  
 <span id="team"></span>  
 <span id="winTag" style="display:none">🏆 WIN</span>

<div class="score"><span id="runs">0</span>/<span id="wickets">0</span></div>  <div id="crrBox">CRR: 0.00</div>  <div>

</div>  <div id="partnershipBox">🤝 Partnership: 0 runs (0 balls)</div>  <div style="margin-top:10px;">  
<button class="run" onclick="play(0)">0</button>  
<button class="run" onclick="play(1)">1</button>  
<button class="run" onclick="play(2)">2</button>  
<button class="run" onclick="play(3)">3</button>  
<button class="run four" onclick="play(4)">4</button>  
<button class="run six" onclick="play(6)">6</button><br>  
<button class="wide" onclick="wideBall()">WIDE</button>
<button class="wide" onclick="noBall()">NO BALL</button>  
<button onclick="bye()">BYE</button>  
<button onclick="legBye()">LEG BYE</button>  
<button class="wicket" onclick="wicket()">WICKET</button>  
<button class="undo" onclick="undo()">UNDO</button><br>  
<button onclick="showMemories()">📜 MATCH MEMORY</button>  
<button onclick="manageMemories()">🗑️ MANAGE MEMORY</button>  
<button class="reset" onclick="resetMatch()">🔄 NEW MATCH</button>  
</div>  <div class="section">  
<b>Fall of Wickets</b>  
<div id="fow" class="fow-list"></div>  
</div>  <div class="section"><b>Batting Scorecard</b><div id="scorecard"></div></div>  
<div class="section"><b>Bowling Scorecard (Wickets Detail)</b><div id="bowling"></div></div>  <div class="section">  
<b>Previous Inning Batting</b>  
<div id="firstBat"></div>  
<br><b>FOW (Prev):</b>  
<div id="firstFow" class="fow-list"></div>  
</div>  
<div class="section"><b>Previous Inning Bowling</b><div id="firstBowl"></div></div>  <div id="graphContainer">  
    <b>📈 Match Progress Graph</b>  
    <canvas id="matchGraph"></canvas>  
    <div style="font-size:10px; display:flex; justify-content:center; gap:10px; margin-top:5px;">  
        <span><span style="color:blue">━</span> Team 1</span>  
        <span><span style="color:red">━</span> Team 2</span>  
        <span><span style="color:black">●</span> Wicket</span>  
    </div>  
</div>  </div>  <div class="scorer">Scorer : Shahin Qumar</div> 
<div id="scorecardModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; overflow-y:auto; padding:20px;">
    <div style="background:white; padding:20px; border-radius:10px; max-width:500px; margin:auto;">
        <button onclick="document.getElementById('scorecardModal').style.display='none'" style="float:right;">❌</button>
        <div id="modalContent"></div>
    </div>
</div>

<script>  
const teamEl = document.getElementById("team"),
    runsEl = document.getElementById("runs"),
    wicketsEl = document.getElementById("wickets"),
    ballsEl = document.getElementById("balls"),
    oversEl = document.getElementById("overs"),
    currentEl = document.getElementById("current"),
    scorecardEl = document.getElementById("scorecard"),
    bowlingEl = document.getElementById("bowling"),
    rrrEl = document.getElementById("rrr"),
    inningInfo = document.getElementById("inningInfo"),
    totalBallsEl = document.getElementById("totalBalls"),
    winTag = document.getElementById("winTag"),
    pBox = document.getElementById("partnershipBox"),
    fowEl = document.getElementById("fow"),
    firstFowEl = document.getElementById("firstFow"),
    crrEl = document.getElementById("crrBox");

let team1, team2, totalOvers, totalBalls;
let innings = 1, target = 0, runs = 0, wickets = 0, balls = 0;
let batsmen = [], bowlers = [], striker = 0, nonStriker = 0, currentBowler = null;
let partnershipRuns = 0, partnershipBalls = 0, undoStack = [], firstBatting = [], firstBowling = [], firstFow = [], matchOver = false;
let fow = [];

// Maiden ट्रैक करने के लिए एक्स्ट्रा वेरिएबल
let bowlerRunsInOver = 0;

let overByOverData = {
    inning1: [{ runs: 0, wickets: 0, over: 0 }],
    inning2: [{ runs: 0, wickets: 0, over: 0 }]
};

window.onload = function () {
    let saved = localStorage.getItem("cricketMatch");
    if (saved) {
        loadState(JSON.parse(saved));
    } else {
        startNewGame();
    }
    update();
};

function startNewGame() {
    team1 = prompt("Team 1 Name") || "Team A";
    team2 = prompt("Team 2 Name") || "Team B";
    totalOvers = parseInt(prompt("Overs?")) || 6;
    totalBalls = totalOvers * 6;
    resetInnings();
    saveMatch();
}

function resetMatch() {
    if (confirm("New match start karein?")) {
        localStorage.removeItem("cricketMatch");
        location.reload();
    }
}

function resetInnings() {
    runs = wickets = balls = 0;
    batsmen = []; bowlers = []; fow = [];
    striker = 0; nonStriker = 1;
    partnershipRuns = 0; partnershipBalls = 0;
    matchOver = false;
    winTag.style.display = "none";
    batsmen.push(createNewBatsman(), createNewBatsman());
    createNewBowler();
}

function createNewBatsman() {
    return {
        name: prompt("Batsman Name") || "Player",
        runs: 0, balls: 0, fours: 0, sixes: 0, out: false, bTag: ""
    };
}

function createNewBowler() {
    let name = prompt("Bowler Name") || "Bowler";
    let exist = bowlers.find(b => b.name === name);
    if (exist) {
        currentBowler = exist;
    } else {
        let b = { name, balls: 0, runs: 0, wickets: 0, wides: 0, noBalls: 0, maidens: 0, wicketsTaken: [] };
        bowlers.push(b);
        currentBowler = b;
    }
    bowlerRunsInOver = 0; // नए ओवर के लिए रन रीसेट
}

function play(r) {
    if (matchOver) return;
    saveUndo();
    runs += r; balls++;
    bowlerRunsInOver += r;
    batsmen[striker].runs += r;
    batsmen[striker].balls++;
    if (r === 4) batsmen[striker].fours++;
    if (r === 6) batsmen[striker].sixes++;
    currentBowler.runs += r;
    currentBowler.balls++;
    partnershipRuns += r;
    partnershipBalls++;
    if (r % 2) changeStrike();
    endBall();
    saveMatch();
}

// वाइड बॉल: पेनल्टी + भाग कर लिए रन
function wideBall() {
    if(matchOver) return;
    saveUndo();

    let extraRuns = parseInt(prompt("वाइड पर भाग कर कितने रन लिए? (0,1,2...)", "0")) || 0;
    let totalWideRuns = 1 + extraRuns; // 1 पेनल्टी + भागने वाले रन

    runs += totalWideRuns;
    currentBowler.runs += totalWideRuns;
    currentBowler.wides++; 
    bowlerRunsInOver += totalWideRuns;

    // अगर भाग कर 1 या 3 रन लिए तो स्ट्राइक बदलो
    if(extraRuns % 2 !== 0) changeStrike();

    update(); 
    saveMatch();
}

// नो बॉल: पेनल्टी + बैट के रन
function noBall() {
    if(matchOver) return;
    saveUndo();

    let batRuns = parseInt(prompt("नो बॉल पर बल्ले से कितने रन बने?", "0")) || 0;
    let totalNBRuns = 1 + batRuns; // 1 पेनल्टी + बल्ले के रन

    runs += totalNBRuns;
    currentBowler.runs += totalNBRuns;
    currentBowler.noBalls++;
    bowlerRunsInOver += totalNBRuns;
    
    batsmen[striker].runs += batRuns; // नो बॉल पर बैट के रन बैट्समैन को मिलते हैं


    if(batRuns % 2 !== 0) changeStrike();

    update();
    saveMatch();
}

function wicket() {
    if (matchOver) return;
    let type = prompt("Wicket Type:\n1 = Bowled/Caught\n2 = Run Out\n3 = LBW/Stumped");
    if (!type) return;
    saveUndo();
    let outIdx;
    if (type === "2") {
        let who = prompt("Kaun Out?\n1=Striker\n2=Non-Striker");
        outIdx = (who === "2") ? nonStriker : striker;
        batsmen[outIdx].bTag = "Run Out";
    } else {
        outIdx = striker;
        batsmen[outIdx].bTag = (type === "1" ? "Caught/Bowled" : "LBW/Stumped") + " b " + currentBowler.name;
        currentBowler.wickets++;
    }
    batsmen[outIdx].out = true;
    wickets++;
    fow.push(runs + "/" + wickets + " (" + batsmen[outIdx].name + ", " + Math.floor(balls / 6) + "." + (balls % 6) + " ov)");
    balls++;
    currentBowler.balls++;
    partnershipRuns = 0; partnershipBalls = 0;
    if (wickets < 10) {
        batsmen.push(createNewBatsman());
        if (outIdx === striker) striker = batsmen.length - 1;
        else nonStriker = batsmen.length - 1;
    }
    endBall();
    saveMatch();
}

function changeStrike() { [striker, nonStriker] = [nonStriker, striker]; }

function endBall() {
    if (innings === 2 && runs >= target) {
        matchOver = true; showWin(team2); update(); return;
    }

    if (balls % 6 === 0) {
        // Maiden Check
        if (bowlerRunsInOver === 0) currentBowler.maidens++;
        
        let dataPoint = { runs: runs, wickets: wickets, over: balls / 6 };
        if (innings === 1) overByOverData.inning1.push(dataPoint);
        else overByOverData.inning2.push(dataPoint);

        if (balls < totalBalls && wickets < 10) {
            changeStrike();
            createNewBowler();
        }
    }

    if (balls === totalBalls || wickets === 10) {
        if (innings === 1) {
            firstBatting = JSON.parse(JSON.stringify(batsmen));
            firstBowling = JSON.parse(JSON.stringify(bowlers));
            firstFow = [...fow];
            target = runs + 1;
            alert("Innings Over! Target: " + target);
            innings = 2;
            resetInnings();
        } else if (!matchOver) {
            matchOver = true;
            if (runs === target - 1) alert("MATCH TIED!");
            else showWin(team1);
        }
    }
    update();
}

function renderScorecards() {
    // Batting Table
    scorecardEl.innerHTML = `
    <table style="width:100%; border-collapse:collapse; font-size:13px;">
        <tr style="background:#e0e0e0;"><th align="left">Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>
        ${batsmen.map(b => {
        let sr = b.balls ? ((b.runs / b.balls) * 100).toFixed(2) : "0.00";
        return `<tr style="border-bottom:1px solid #ddd;">
                <td align="left">${b.name}<br><span style="font-size:11px;color:#666">${b.out ? b.bTag : "not out"}</span></td>
                <td>${b.runs}</td><td>${b.balls}</td><td>${b.fours}</td><td>${b.sixes}</td><td>${sr}</td>
            </tr>`;
    }).join("")}
    </table>`;

    // Bowling Table (Like the Image)
    bowlingEl.innerHTML = `
    <table style="width:100%; border-collapse:collapse; font-size:13px; margin-top:10px;">
        <tr style="background:#f2f2f2; border-bottom:2px solid #ccc;">
            <th align="left">Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>NB</th><th>WD</th><th>ECO</th>
        </tr>
        ${bowlers.map(b => {
        let overs = Math.floor(b.balls / 6) + "." + (b.balls % 6);
        let eco = b.balls > 0 ? ((b.runs / b.balls) * 6).toFixed(2) : "0.00";
        let isCurrent = (currentBowler && b.name === currentBowler.name) ? "color:green; font-weight:bold;" : "";
        return `<tr style="border-bottom:1px solid #ddd; ${isCurrent}">
                <td align="left">${b.name}</td>
                <td>${overs}</td><td>${b.maidens}</td><td>${b.runs}</td><td>${b.wickets}</td>
                <td>${b.noBalls}</td><td>${b.wides}</td><td>${eco}</td>
            </tr>`;
    }).join("")}
    </table>`;

    // FOW and Histories
    fowEl.innerHTML = fow.length > 0 ? fow.join(" , ") : "No wickets yet";
    document.getElementById("firstBat").innerHTML = firstBatting.map((b, i) => `${i + 1}. ${b.name} - ${b.runs}(${b.balls}) | ${b.out ? b.bTag : "NOT OUT"}<br>`).join("");
    document.getElementById("firstBowl").innerHTML = firstBowling.map(b => `${b.name} - ${b.wickets} wkts (R:${b.runs})<br>`).join("");
    firstFowEl.innerHTML = firstFow.length > 0 ? firstFow.join(" , ") : "N/A";
}

function update() {
    teamEl.innerText = (innings === 1 ? team1 : team2);
    totalBallsEl.innerText = totalBalls;
    inningInfo.innerText = "Innings: " + innings + (target > 0 ? " | Target: " + target : "");
    runsEl.innerText = runs; wicketsEl.innerText = wickets;
    ballsEl.innerText = balls;
    oversEl.innerText = Math.floor(balls / 6) + "." + (balls % 6);
    let crr = balls > 0 ? ((runs / (balls / 6))).toFixed(2) : "0.00";
    crrEl.innerText = "CRR: " + crr;
    currentEl.innerHTML = `
        <div class="strikeBat">${batsmen[striker].name} - ${batsmen[striker].runs}(${batsmen[striker].balls}) <span class="strikeIcon">🏏</span></div>  
        <div>${batsmen[nonStriker].name} - ${batsmen[nonStriker].runs}(${batsmen[nonStriker].balls})</div>`;
    pBox.innerText = `🤝 Partnership: ${partnershipRuns} runs (${partnershipBalls} balls)`;
    renderScorecards();
    updateRRR();
    drawGraph();
}

// बाकी के फंक्शन्स (updateRRR, drawGraph, saveMatch आदि) वैसे ही रहेंगे जैसे पहले थे
function updateRRR() {
    if (innings === 2 && !matchOver) {
        let bl = totalBalls - balls;
        let rl = target - runs;
        rrrEl.innerText = bl > 0 ? `Need ${rl} from ${bl} balls (RRR: ${((rl / bl) * 6).toFixed(2)})` : "";
    } else { rrrEl.innerText = ""; }
}

function showWin(winner) {
    winTag.style.display = "inline";
    let msg = (innings === 2) ? `${winner} won by ${10 - wickets} wickets!` : `${winner} won by ${target - 1 - runs} runs!`;
    
    // यह फंक्शन हिस्ट्री में डेटा डालता है
    saveMatchToHistory(); 
    
    saveMatchMemory(msg);
    alert("🏆 " + msg);
}

// यह नया फंक्शन स्क्रिप्ट में जोड़ें
function saveMatchToHistory() {
    saveMatch(); 
    let matchData = JSON.parse(localStorage.getItem("cricketMatch"));
    let history = JSON.parse(localStorage.getItem("cricketMatchHistory") || "[]");

    matchData.timestamp = new Date().toLocaleString();
    history.push(matchData);
    localStorage.setItem("cricketMatchHistory", JSON.stringify(history));
}


function saveMatch() {
    let state = {
        team1, team2, totalOvers, totalBalls, innings, target, runs, wickets, balls,
        batsmen, bowlers, striker, nonStriker, partnershipRuns, partnershipBalls,
        firstBatting, firstBowling, firstFow, fow, matchOver, bowlerName: currentBowler?.name,
        overByOverData
    };
    localStorage.setItem("cricketMatch", JSON.stringify(state));
}

function loadState(s) {
    team1 = s.team1; team2 = s.team2; totalOvers = s.totalOvers; totalBalls = s.totalBalls;
    innings = s.innings; target = s.target; runs = s.runs; wickets = s.wickets; balls = s.balls;
    batsmen = s.batsmen; bowlers = s.bowlers; striker = s.striker; nonStriker = s.nonStriker;
    partnershipRuns = s.partnershipRuns; partnershipBalls = s.partnershipBalls;
    firstBatting = s.firstBatting; firstBowling = s.firstBowling;
    firstFow = s.firstFow || []; fow = s.fow || [];
    matchOver = s.matchOver;
    overByOverData = s.overByOverData;
    currentBowler = bowlers.find(b => b.name === s.bowlerName);
}

function saveUndo() { undoStack.push(JSON.stringify(JSON.parse(localStorage.getItem("cricketMatch")))); }
function undo() { if (!undoStack.length) return; loadState(JSON.parse(undoStack.pop())); update(); saveMatch(); }

function saveMatchMemory(res) {
    let mem = JSON.parse(localStorage.getItem("cricketMemories")) || [];
    let matchDetail = { date: new Date().toLocaleString(), summary: `${team1} vs ${team2}`, result: res };
    mem.push(matchDetail); localStorage.setItem("cricketMemories", JSON.stringify(mem));
}

function showMemories() {
    let history = JSON.parse(localStorage.getItem("cricketMatchHistory") || "[]");
    
    if (history.length === 0) {
        alert("कोई मैच रिकॉर्ड नहीं है!");
        return;
    }

    let modal = document.getElementById("scorecardModal");
    let content = document.getElementById("modalContent");

    let listHTML = `<h3>Match History (क्लिक करें)</h3>`;
    history.forEach((m, index) => {
        listHTML += `
            <div onclick="showFullScorecard(${index})" style="padding:12px; border-bottom:1px solid #ddd; cursor:pointer; background:#f9f9f9; margin-bottom:5px;">
                <b>${m.team1} vs ${m.team2}</b><br>
                <small>${m.timestamp} | ${m.runs}/${m.wickets}</small>
            </div>`;
    });

    content.innerHTML = listHTML;
    modal.style.display = "block";
}



function manageMemories() {
    let history = JSON.parse(localStorage.getItem("cricketMatchHistory") || "[]");
    
    if (history.length === 0) {
        alert("कोई मैच हिस्ट्री उपलब्ध नहीं है!");
        return;
    }

    let modal = document.getElementById("scorecardModal");
    let content = document.getElementById("modalContent");

    // चेकबॉक्स लिस्ट बनाना
    let listHTML = `<h3>मैच डिलीट करें</h3>`;
    history.forEach((m, i) => {
        listHTML += `<div><input type="checkbox" class="match-check" value="${i}"> 
        ${m.timestamp} | ${m.team1} vs ${m.team2}</div>`;
    });
    
    listHTML += `<br><button onclick="deleteSelected()">✅ चुनिंदा डिलीट करें</button>`;
    content.innerHTML = listHTML;
    modal.style.display = "block";
}

// चुनिंदा मैचों को डिलीट करने का फंक्शन
function deleteSelected() {
    let history = JSON.parse(localStorage.getItem("cricketMatchHistory") || "[]");
    let checkboxes = document.querySelectorAll('.match-check:checked');
    
    if (checkboxes.length === 0) { alert("कोई मैच नहीं चुना!"); return; }

    let indices = Array.from(checkboxes).map(cb => parseInt(cb.value)).sort((a, b) => b - a);
    
    indices.forEach(idx => history.splice(idx, 1));
    
    localStorage.setItem("cricketMatchHistory", JSON.stringify(history));
    alert("चुनिंदा मैच डिलीट कर दिए गए!");
    document.getElementById('scorecardModal').style.display = 'none';
}

// बाय (Bye): बॉलर के खाते में रन नहीं जुड़ते
function bye() {
    if(matchOver) return;
    saveUndo();

    let r = parseInt(prompt("Byes के कितने रन मिले?", "0")) || 0;
    runs += r;
    balls++; // लीगल डिलीवरी है, इसलिए बॉल बढ़ेगी
    currentBowler.balls++;
    
    // बाय के रन बॉलर के रन (R) कॉलम में नहीं जुड़ते
    if(r % 2 !== 0) changeStrike();
    
    endBall(); 
    saveMatch();
}

// लेग बाय (Leg Bye)
function legBye() {
    if(matchOver) return;
    saveUndo();

    let r = parseInt(prompt("Leg Byes के कितने रन मिले?", "0")) || 0;
    runs += r;
    balls++; 
    currentBowler.balls++;

    if(r % 2 !== 0) changeStrike();
    
    endBall();
    saveMatch();
}
