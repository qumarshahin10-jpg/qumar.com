<!DOCTYPE html>
<html>
<head>
    <title>Live Cricket Scorer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB3_Yt5cc7eXXvxKlIaovAvIZ4l5fWIC1g",
            authDomain: "bkcclive.firebaseapp.com",
            databaseURL: "https://bkcclive-default-rtdb.firebaseio.com",
            projectId: "bkcclive",
            storageBucket: "bkcclive.firebasestorage.app",
            messagingSenderId: "1042728754418",
            appId: "1:1042728754418:web:7bed9c4bf9b6e5f15e446b"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getDatabase(app);
        window.ref = ref;
        window.set = set;
        window.onValue = onValue;

        // लाइव स्कोर लिसनर (जो सबके मोबाइल पर अपडेट करेगा)
        onValue(ref(window.db, 'liveMatch/'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById("runs").innerText = data.runs;
                document.getElementById("wickets").innerText = data.wickets;
                document.getElementById("overs").innerText = data.overs;
            }
        });
    </script>
</head>
<body>
    <div style="text-align:center; padding:20px;">
        <h1>Score: <span id="runs">0</span>/<span id="wickets">0</span></h1>
        <p>Overs: <span id="overs">0.0</span></p>

        <button onclick="window.updateScore(1)">+1 Run</button>
        <button onclick="window.updateScore(4)">+4 Runs</button>
        <button onclick="window.updateScore(6)">+6 Runs</button>
    </div>

    <script>
        // स्कोर अपडेट करने वाला फंक्शन
        window.updateScore = (runsToAdd) => {
            let currentRuns = parseInt(document.getElementById("runs").innerText);
            let newRuns = currentRuns + runsToAdd;
            
            // Firebase में डेटा सेव करें
            window.set(window.ref(window.db, 'liveMatch/'), {
                runs: newRuns,
                wickets: 0, // इसे आप विकेट के हिसाब से अपडेट कर सकते हैं
                overs: "0.1" 
            });
        };
    </script>
</body>
</html>
