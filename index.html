<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Jharkhand District Information</title>
<style>
body{
font-family:Arial;
background:#f4f4f4;
text-align:center;
}

h1{
background:#2e7d32;
color:white;
padding:15px;
}

.container{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.box{
background:white;
margin:10px;
padding:15px;
border-radius:8px;
width:150px;
cursor:pointer;
box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

.box:hover{
background:#c8e6c9;
}

#info{
margin-top:20px;
padding:20px;
background:white;
border-radius:10px;
width:80%;
margin-left:auto;
margin-right:auto;
box-shadow:0 2px 5px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<h1>Jharkhand District Information</h1>

<div class="container">

<div class="box" onclick="showInfo('ranchi')">Ranchi</div>
<div class="box" onclick="showInfo('dhanbad')">Dhanbad</div>
<div class="box" onclick="showInfo('bokaro')">Bokaro</div>
<div class="box" onclick="showInfo('deoghar')">Deoghar</div>
<div class="box" onclick="showInfo('dumka')">Dumka</div>
<div class="box" onclick="showInfo('hazaribagh')">Hazaribagh</div>
<div class="box" onclick="showInfo('giridih')">Giridih</div>
<div class="box" onclick="showInfo('godda')">Godda</div>
<div class="box" onclick="showInfo('sahibganj')">Sahibganj</div>
<div class="box" onclick="showInfo('pakur')">Pakur</div>

</div>

<div id="info">
Click on any district to see information.
</div>

<script>

function showInfo(d){

let text="";

if(d=="ranchi"){
text="Ranchi is the capital of Jharkhand. It is famous for waterfalls and industries.";
}

if(d=="dhanbad"){
text="Dhanbad is known as the Coal Capital of India because of coal mines.";
}

if(d=="bokaro"){
text="Bokaro is famous for Bokaro Steel Plant.";
}

if(d=="deoghar"){
text="Deoghar is famous for Baba Baidyanath Dham temple.";
}

if(d=="dumka"){
text="Dumka is called the sub capital of Jharkhand.";
}

if(d=="hazaribagh"){
text="Hazaribagh is famous for forests and wildlife.";
}

if(d=="giridih"){
text="Giridih is known for Parasnath Hill.";
}

if(d=="godda"){
text="Godda is known for agriculture and Adani power plant.";
}

if(d=="sahibganj"){
text="Sahibganj is located on the bank of Ganga river.";
}

if(d=="pakur"){
text="Pakur is famous for black stone mining.";
}

document.getElementById("info").innerHTML=text;

}

</script>

</body>
</html>
