<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Live Cricket Scorer</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB3_Yt5cc7eXXvxKlIaovAvIZ4l5fWIC1g",
            authDomain: "bkcclive.firebaseapp.com",
            databaseURL: "https://bkcclive-default-rtdb.firebaseio.com",
            projectId: "bkcclive",
            storageBucket: "bkcclive.firebasestorage.app",
            messagingSenderId: "1042728754418",
            appId: "1:1042728754418:web:7bed9c4bf9b6e5f15e446b"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getDatabase(app);
        window.ref = ref;
        window.set = set;
        window.onValue = onValue;

        // Firebase से लाइव डेटा सुनने वाला सिस्टम
        window.onValue(window.ref(window.db, 'liveMatch/'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById("runs").innerText = data.runs;
                document.getElementById("wickets").innerText = data.wickets;
                document.getElementById("overs").innerText = data.overs;
                if(typeof update === 'function') update();
            }
        });
    </script>
</head>
<body>
    <div class="score">Score: <span id="runs">0</span>/<span id="wickets">0</span></div>
    <div>Overs: <span id="overs">0.0</span></div>

    <button onclick="window.play(0)">0</button>
    <button onclick="window.play(1)">1</button>
    <button onclick="window.play(2)">2</button>
    <button onclick="window.play(3)">3</button>
    <button onclick="window.play(4)">4</button>
    <button onclick="window.play(6)">6</button>
    <button onclick="window.openWicketModal()" style="color:red">WICKET</button>
    <button onclick="window.undo()">UNDO</button>

    <script>
        // सभी फंक्शन को window पर रजिस्टर करें ताकि HTML उन्हें देख सके
        window.play = play;
        window.undo = undo;
        window.openWicketModal = openWicketModal;

        // फायरबेस अपडेट फंक्शन
        function updateFirebase() {
            if (window.db && window.set) {
                window.set(window.ref(window.db, 'liveMatch/'), {
                    runs: runs,
                    wickets: wickets,
                    overs: Math.floor(balls / 6) + "." + (balls % 6)
                });
            }
        }
        
        // अपने पुराने 'play' फंक्शन के अंदर सबसे नीचे 'updateFirebase()' जोड़ें
        function play(r) {
            // ... आपका कोड ...
            saveMatch();
            updateFirebase(); // यह लाइन जोड़ दी
            update();
        }
    </script>
</body>
</html>
